<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Typing Speed App</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: -10px;
      margin-bottom: 10px;
      display: none;
    }
    
    .loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .password-group {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #666;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <h2><img src="https://img.icons8.com/ios-filled/50/4a90e2/box.png" alt="Logo"/>Typetest</h2>
    </div>

    <div class="form-section">
      <h4>Please enter your details</h4>
      <h2>Welcome back</h2>

      <form id="login-form">
        <div class="form-group">
          <input type="email" id="email" placeholder="Email address" required />
          <div id="email-error" class="error-message"></div>
        </div>

        <div class="form-group password-group">
          <input type="password" id="password" placeholder="Password" required />
          <span class="toggle-password" onclick="togglePassword()"></span>
          <div id="password-error" class="error-message"></div>
        </div>

        <button type="submit" id="submit-btn" class="primary-btn">Sign in</button>

        <div class="or">OR</div>

        <p class="footer-text">
          Don't have an account? <a href="register.html">Sign up</a>
        </p>
      </form>
    </div>
  </div>

  <script>
    // Check if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = 'home.html';
    }

    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const toggleBtn = document.querySelector(".toggle-password");
      
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleBtn.textContent = "🔒";
      } else {
        passwordInput.type = "password";
        toggleBtn.textContent = "";
      }
    }

    function showError(elementId, message) {
      const errorElement = document.getElementById(elementId);
      errorElement.textContent = message;
      errorElement.style.display = "block";
    }

    function clearErrors() {
      document.querySelectorAll(".error-message").forEach(el => {
        el.style.display = "none";
        el.textContent = "";
      });
    }

    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const submitBtn = document.getElementById("submit-btn");

      // Validation
      let hasError = false;
      
      if (!validateEmail(email)) {
        showError("email-error", "Please enter a valid email address");
        hasError = true;
      }

      if (password.length < 6) {
        showError("password-error", "Password must be at least 6 characters");
        hasError = true;
      }

      if (hasError) return;

      // Disable button and show loading state
      submitBtn.disabled = true;
      submitBtn.classList.add("loading");
      submitBtn.textContent = "Signing in...";

      try {
        const res = await fetch("http://localhost:5000/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        
        if (!res.ok) {
          if (data.error === "Invalid credentials") {
            showError("password-error", "Invalid email or password");
          } else {
            showError("password-error", data.error || "Login failed. Please try again.");
          }
          return;
        }

        // Store token per-tab to avoid cross-tab identity collision during multi-user testing
        try {
          sessionStorage.setItem('token', data.token);
          sessionStorage.setItem('username', data.user.username);
        } catch (e) {}
        // Clear any old global values to prevent other tabs from reading them
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        
        window.location.href = 'home.html';
      } catch (err) {
        showError("password-error", "Network error. Please check your connection.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove("loading");
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
